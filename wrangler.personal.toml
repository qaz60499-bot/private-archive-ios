"$schema" = "./node_modules/wrangler/config-schema.json"
name = "private-archive-personal-local"
main = "src/worker/index.ts"
compatibility_date = "2026-08-11"
workers_dev = false
preview_urls = false

[vars]
MOCK_TELEGRAM = "false"
ALLOWED_ORIGIN = "http://127.0.0.1:8798"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "private-archive-db"
database_id = "8ca60403-dd2b-48fa-8e07-9b0274a258fc"
migrations_dir = "migrations"
remote = true

[[kv_namespaces]]
binding = "PREVIEW_CACHE"
id = "32a3a4cbeb2347df857800e25b2bfc04"
remote = true

[[queues.producers]]
binding = "ANALYSIS_QUEUE"
queue = "private-archive-analysis"
remote = true

[ai]
binding = "AI"
remote = true
