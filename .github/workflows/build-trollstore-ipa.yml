# Manual unsigned iOS build for TrollStore installation.
name: Build TrollStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run upload regression suite
        run: |
          npm run typecheck
          npm run lint
          npm run test -- --run

      - name: Prepare Capacitor iOS project
        run: npm run ios:prepare

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Analyze iOS upload implementation
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/AnalyzeData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            analyze

      - name: Build iPhone app without Apple signing
        run: |
          set -euo pipefail
          rm -rf build/DerivedData build/Payload build/PrivateArchive-TrollStore.ipa
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package TrollStore IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/PrivateArchive-TrollStore.ipa
          unzip -l build/PrivateArchive-TrollStore.ipa | head -n 40
          shasum -a 256 build/PrivateArchive-TrollStore.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateArchive-TrollStore-IPA
          path: build/PrivateArchive-TrollStore.ipa
          if-no-files-found: error
          retention-days: 30
