# Manual unsigned iOS build for TrollStore installation.
name: Build TrollStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run upload regression suite
        run: |
          npm run typecheck
          npm run lint
          npm run test -- --run
          node scripts/verify-ios-background-upload.mjs

      - name: Prepare Capacitor iOS project
        run: npm run ios:prepare

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Run iOS Simulator picker, bulk import, and upload protocol smoke
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; items=[d for runtime,devices in data.items() if "iOS" in runtime for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; assert items, "no available iPhone simulator"; print(items[0]["udid"])')"
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/SimulatorData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
          APP_PATH="build/SimulatorData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          LOG_FILE="$RUNNER_TEMP/private-archive-picker-smoke.log"
          SERVER_LOG="$RUNNER_TEMP/private-archive-protocol-server.log"
          SERVER_PID=""
          xcrun simctl spawn "$UDID" log stream --style compact --level debug --predicate 'process == "App"' > "$LOG_FILE" 2>&1 &
          LOG_PID=$!
          cleanup() {
            if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
            kill "$LOG_PID" 2>/dev/null || true
            xcrun simctl terminate "$UDID" cd.cc.joye.photo 2>/dev/null || true
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
          }
          trap cleanup EXIT
          wait_for_log_marker() {
            marker="$1"
            timeout_seconds="$2"
            for attempt in $(seq 1 "$timeout_seconds"); do
              if grep -q "$marker" "$LOG_FILE"; then return 0; fi
              sleep 1
            done
            echo "Missing iOS runtime smoke marker after ${timeout_seconds}s: $marker" >&2
            echo "--- App simulator log ---" >&2
            cat "$LOG_FILE" >&2 || true
            echo "--- Recent App unified log ---" >&2
            xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "App"' >&2 || true
            return 1
          }

          sleep 1
          SIMCTL_CHILD_PRIVATE_ARCHIVE_PICKER_SMOKE=1 xcrun simctl launch --terminate-running-process "$UDID" cd.cc.joye.photo
          wait_for_log_marker 'PRIVATE_ARCHIVE_PICKER_SMOKE_PRESENTED' 45
          wait_for_log_marker 'PRIVATE_ARCHIVE_PICKER_SMOKE_DISMISSED' 45
          wait_for_log_marker 'PRIVATE_ARCHIVE_BULK_IMPORT_SMOKE_COMPLETED count=80 recoverable=80' 60

          xcrun simctl terminate "$UDID" cd.cc.joye.photo 2>/dev/null || true
          node scripts/ios-upload-protocol-smoke-server.mjs > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then break; fi
            if [ "$attempt" -eq 20 ]; then cat "$SERVER_LOG"; exit 1; fi
            sleep 0.25
          done
          SIMCTL_CHILD_PRIVATE_ARCHIVE_NATIVE_PROTOCOL_SMOKE=1 \
          SIMCTL_CHILD_PRIVATE_ARCHIVE_API_BASE_OVERRIDE=http://127.0.0.1:18765 \
            xcrun simctl launch --terminate-running-process "$UDID" cd.cc.joye.photo
          sleep 22

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          SERVER_PID=""
          kill "$LOG_PID" 2>/dev/null || true
          wait "$LOG_PID" 2>/dev/null || true
          cat "$SERVER_LOG"
          cat "$LOG_FILE"
          grep -q 'PRIVATE_ARCHIVE_PROTOCOL_SERVER_RESERVE_OK' "$SERVER_LOG"
          grep -q 'PRIVATE_ARCHIVE_PROTOCOL_SERVER_CONTENT_OK bytes=262144' "$SERVER_LOG"
          grep -q 'PRIVATE_ARCHIVE_PROTOCOL_SMOKE_COMPLETED' "$LOG_FILE"
          if grep -E 'PRIVATE_ARCHIVE_(PROTOCOL|BULK_IMPORT)_SMOKE_FAILED|Terminating app due to uncaught exception|Main Thread Checker|EXC_BAD_ACCESS|Fatal error' "$LOG_FILE"; then
            echo 'iOS runtime smoke detected an upload/picker failure or native crash' >&2
            exit 1
          fi

      - name: Analyze iOS upload implementation
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/AnalyzeData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            analyze

      - name: Build iPhone app without Apple signing
        run: |
          set -euo pipefail
          rm -rf build/DerivedData build/Payload build/PrivateArchive-TrollStore.ipa
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package TrollStore IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/PrivateArchive-TrollStore.ipa
          unzip -l build/PrivateArchive-TrollStore.ipa | head -n 40
          shasum -a 256 build/PrivateArchive-TrollStore.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateArchive-TrollStore-IPA
          path: build/PrivateArchive-TrollStore.ipa
          if-no-files-found: error
          retention-days: 30
